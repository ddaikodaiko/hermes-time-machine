name: hermes-time-machine
version: 0.2.2
description: Incremental checkpoints, a point-of-no-return approval gate and effect memory for Hermes; a rollback restores files, this knows what it cannot undo.
author: ddaikodaiko
license: MIT
homepage: https://github.com/ddaikodaiko/hermes-time-machine
tags: [safety, rollback, checkpoints, workspace, time-travel]

# Verified against Hermes Agent 0.23.
requires_hermes: ">=0.23.0"

provides_tools:
  - atm_checkpoint
  - atm_rewind
  - atm_fork
  - atm_list
  - atm_effects

provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - post_compaction

config_schema:
  workspace:
    type: str
    default: ""
    description: Absolute path to the workspace to protect. Empty means the current working directory.
  auto_checkpoint:
    type: bool
    default: true
    description: Take a checkpoint automatically before a risky tool call.
  auto_checkpoint_mutations:
    type: bool
    default: true
    description: Take one checkpoint before the first file-changing call of each turn.
  mutation_cooldown_seconds:
    type: int
    default: 120
    description: Minimum seconds between mutation checkpoints when the host provides no turn id.
  risk_threshold:
    type: float
    default: 0.6
    description: Minimum risk score (0-1) that triggers an automatic checkpoint.
  max_snapshot_mb:
    type: int
    default: 200
    description: Skip automatic snapshots larger than this. Manual checkpoints are always allowed.
  retention:
    type: int
    default: 20
    description: Number of automatic checkpoints to keep. Manual checkpoints are never pruned.
  exclude_git:
    type: bool
    default: false
    description: Exclude the .git directory from snapshots. Faster, but rewind will not restore git metadata.
  extra_risky_patterns:
    type: list
    default: []
    description: Additional regular expressions that mark a terminal command as risky.
  irreversible_gate:
    type: str
    default: approve
    choices: [approve, warn, off]
    label: Irreversible-effect gate
    description: approve asks the human through Hermes' approval prompt before git push, npm publish, terraform apply and similar; warn only logs; off disables the gate.
  gate_allow_patterns:
    type: list
    default: []
    label: Gate allow patterns
    description: Regular expressions; a command matching one never triggers the approval prompt.
  gate_tools:
    type: str
    default: approve
    choices: [approve, warn, off]
    label: Gate for MCP and plugin tools
    description: approve asks before MCP/plugin tools that open PRs, merge, release, send messages, deploy or delete; warn only records them; off ignores tools.
  gate_tool_allow_patterns:
    type: list
    default: []
    label: Tool allow patterns
    description: Regular expressions on the tool name; a matching tool is recorded in the ledger but never asks.
  auto_budget_seconds:
    type: float
    default: 5.0
    label: Automatic checkpoint budget
    description: Time limit in seconds (0.5-20) for an automatic checkpoint. A capture that runs out keeps its progress and resumes on the next attempt.
  max_file_mb:
    type: int
    default: 50
    label: Largest file to snapshot (MB)
    description: Files bigger than this are skipped (and counted) instead of copied into checkpoints.
  effect_memory:
    type: bool
    default: true
    label: Effect memory
    description: After /rollback, /undo, /retry or compaction, remind the model of irreversible effects it can no longer see.
  struggle_threshold:
    type: int
    default: 4
    label: Struggle hint threshold
    description: Hint at atm_rewind after this many consecutive failing calls since the last checkpoint. 0 disables the hint.
  annotate_results:
    type: bool
    default: true
    label: Annotate tool results
    description: Tell the model where its restore point is by adding a time_machine note to tool results.
