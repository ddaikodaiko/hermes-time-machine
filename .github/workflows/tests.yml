name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # The plugin is stdlib only. FastAPI (shipped by Hermes itself) is installed here
      # only to exercise the dashboard routes. Hermes integration tests skip themselves
      # when Hermes is not importable.
      - name: Test-only dependencies
        run: python -m pip install --quiet fastapi httpx
      - name: Unit and flow tests
        run: python -m unittest discover -s tests -v
      - name: Standalone demo
        run: python demo/run_demo.py
